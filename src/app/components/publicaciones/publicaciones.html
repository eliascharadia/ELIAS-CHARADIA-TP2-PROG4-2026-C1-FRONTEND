<div class="publicaciones-page">

  <div class="container">

    <div class="filtros-orden">
      <span class="label-orden">Ordenar por:</span>
      <button
        class="btn-orden"
        [class.activo]="orden() === 'fecha'"
        (click)="cambiarOrden('fecha')"
      >
        Más recientes
      </button>
      <button
        class="btn-orden"
        [class.activo]="orden() === 'likes'"
        (click)="cambiarOrden('likes')"
      >
        Más populares
      </button>
    </div>

    @if (cargando()) {
      <div class="text-center mt-5">
        <div class="spinner-border text-light" role="status"></div>
      </div>
    } @else if (publicaciones().length === 0) {
      <p class="text-center text-secondary mt-5">No hay publicaciones para mostrar.</p>
    } @else {

      @for (pub of publicaciones(); track pub._id) {
        <app-publicacion
          [publicacion]="pub"
          [usuarioActualId]="usuarioActualId()"
          (darLike)="onDarLike($event)"
          (quitarLike)="onQuitarLike($event)"
          (eliminar)="onEliminar($event)"
        />
      }

      <div class="paginacion">
        <button class="btn btn-outline-light paginacion-btn" [disabled]="paginaActual() === 0" (click)="paginaAnterior()">
          Anterior
        </button>
        <span class="pagina-info">Página {{ paginaActual() + 1 }}</span>
        <button class="btn btn-outline-light paginacion-btn" [disabled]="publicaciones().length < limitePorPagina" (click)="paginaSiguiente()">
          Siguiente
        </button>
      </div>

    }

  </div>

</div>
